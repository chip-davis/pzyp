[package]
name = "pzyp"
version = "0.1.0"
edition = "2024"
description = "A prettier front-end for zypper, styled after all of your favorite package managers."
authors = ["chip-davis"]
license = "MIT"
repository = "https://github.com/chip-davis/pzyp"
homepage = "https://github.com/chip-davis/pzyp"
readme = "README.md"
keywords = ["zypper", "opensuse", "package-manager", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "assets/", "demo.tape"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
console = "0.16.6"
indicatif = "0.18.6"
libc = "0.2.191"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
